name: Run Discord Shorts Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  run-bot:
    name: Run bot (maximum 6 hours)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-3.8-flash-tts' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'Kore' }}
      WORK_DIR: work
      MAX_VIDEO_MINUTES: "30"
      MAX_DOWNLOAD_MB: "500"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate required secrets
        run: |
          test -n "$DISCORD_TOKEN" || (echo "::error::Missing DISCORD_TOKEN secret" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "::error::Missing GEMINI_API_KEY secret" && exit 1)
          test -n "$GOOGLE_DRIVE_CREDENTIALS" || (echo "::error::Missing GOOGLE_DRIVE_CREDENTIALS secret" && exit 1)
          ffmpeg -hide_banner -filters | grep -q subtitles || (echo "::error::FFmpeg subtitles filter is unavailable" && exit 1)

      - name: Start Discord bot
        run: python main.py
