name: Google Drive OAuth Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-drive-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate OAuth credentials and test Drive API
        env:
          GDRIVE_AUTO_JSON: ${{ secrets.GDrive_Auto }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          raw = os.environ.get("GDRIVE_AUTO_JSON", "").strip()
          if not raw:
              sys.exit("ERROR: GitHub Actions secret GDrive_Auto belum dibuat.")

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit("ERROR: GDrive_Auto bukan JSON yang valid.")

          config = payload.get("web") or payload.get("installed") or payload
          client_id = config.get("client_id")
          client_secret = config.get("client_secret")
          token_uri = config.get("token_uri", "https://oauth2.googleapis.com/token")
          refresh_token = payload.get("refresh_token") or config.get("refresh_token")

          if not all((client_id, client_secret)):
              sys.exit("ERROR: client_id/client_secret tidak ditemukan di GDrive_Auto.")

          if not refresh_token:
              sys.exit(
                  "BELUM SIAP: refresh_token belum ada. "
                  "Selesaikan persetujuan OAuth di Google OAuth Playground, "
                  "lalu tambahkan refresh_token ke objek JSON GDrive_Auto."
              )

          try:
              token_response = requests.post(
                  token_uri,
                  data={
                      "client_id": client_id,
                      "client_secret": client_secret,
                      "refresh_token": refresh_token,
                      "grant_type": "refresh_token",
                  },
                  timeout=30,
              )
          except requests.RequestException:
              sys.exit("ERROR: Tidak dapat menghubungi Google OAuth token endpoint.")

          if token_response.status_code != 200:
              # Do not print response bodies: they may contain sensitive diagnostic data.
              sys.exit(
                  f"ERROR: Google menolak refresh token (HTTP {token_response.status_code}). "
                  "Periksa client ID/secret, refresh token, dan status OAuth consent screen."
              )

          access_token = token_response.json().get("access_token")
          if not access_token:
              sys.exit("ERROR: Google tidak mengembalikan access_token.")

          try:
              drive_response = requests.get(
                  "https://www.googleapis.com/drive/v3/files",
                  headers={"Authorization": f"Bearer {access_token}"},
                  params={"pageSize": 1, "fields": "files(id,name)"},
                  timeout=30,
              )
          except requests.RequestException:
              sys.exit("ERROR: Tidak dapat menghubungi Google Drive API.")

          if drive_response.status_code != 200:
              sys.exit(
                  f"ERROR: Token berhasil dibuat, tetapi Google Drive API menolak akses "
                  f"(HTTP {drive_response.status_code}). Pastikan Drive API aktif dan scope "
                  "https://www.googleapis.com/auth/drive.file sudah disetujui."
              )

          print("SUCCESS: OAuth refresh berhasil dan Google Drive API dapat diakses.")
          PY
